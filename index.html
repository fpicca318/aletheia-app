// Accorcia un testo lungo per le anteprime, senza spezzare a metà parola quando possibile
function truncate(str, max = 70) {
  if (!str) return "";
  const s = str.trim();
  if (s.length <= max) return s;
  return s.slice(0, max).replace(/\s+\S*$/, "") + "…";
}
